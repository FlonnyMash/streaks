<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Flonny App — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #000000;
        color: #f2f2f7;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        max-width: 28rem;
      }

  <body>
    <main>
      <h1>You're offline</h1>
      <p>Flonny App needs a connection to load your dashboard. Reconnect and try again.</p>

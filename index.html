<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=9" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=9" />
    <link rel="icon" href="/favicon.svg?v=9" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon-32.png?v=9" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9" />
    <link rel="manifest" href="/manifest.json?v=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mashed" />
    <meta name="description" content="Mashed Personal Dashboard — streaks, todos, and timesheet in one place." />
    <title>Mashed Personal Dashboard</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.add(dark ? 'dark' : 'light')
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#000000' : '#f2f2f7')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
